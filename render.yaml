# Render reads this file and pre-fills the service settings.
# You still add the secret env vars (LLM_API_KEY etc.) in the dashboard.
services:
  - type: web
    name: hermes-agent
    env: python
    plan: free          # IMPORTANT: free, not starter — no card needed
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    healthCheckPath: /health
